[project]
name = "atelier-builtin-animation"
version = "0.1.0"
description = "Built-in animation primitives for Atelier"
requires-python = ">=3.12"
dependencies = [
    "atelier-plugin-sdk",
    "numpy>=2.1",
    "pydantic>=2.9",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
