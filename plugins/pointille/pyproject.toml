[project]
name = "atelier-pointille"
version = "0.1.0"
description = "Atelier point_distributor plugin wrapping the Pointille core"
requires-python = ">=3.12"
dependencies = [
    "atelier-plugin-sdk",
    "numpy>=2.1",
    "pointille",
    "pydantic>=2.9",
    "scipy>=1.14",
]

[tool.uv.sources]
# The author's main branch on GitHub, pinned by uv.lock; `atelier update` moves the pin to the
# newest commit (ADR-041, replaces the local atelier-integration branch of ADR-013).
pointille = { git = "https://github.com/Styans/Pointille", branch = "main" }

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
