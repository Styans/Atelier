[project]
name = "atelier-workspace"
version = "0.1.0"
description = "Atelier: local drone-show production platform, from idea to fleet files"
requires-python = ">=3.12"
dependencies = [
    "atelier-domain",
    "atelier-plugin-sdk",
    "atelier-plugin-host",
    "atelier-show-engine",
    "atelier-blender-bridge",
    "atelier-cli",
    "atelier-jobs",
    "atelier-worker",
    "atelier-api",
    "atelier-assistant",
    # Plugins are discovered from plugins/ at runtime; listing them here only installs
    # their dependencies into the platform environment.
    "atelier-builtin-animation",
    "atelier-builtin-transitions",
    "atelier-builtin-validators",
    "atelier-builtin-exporters",
    "atelier-pointille",
    "atelier-blender-skybrush",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# The root only ties the workspace together; it is never built or installed.
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*", "apps/cli", "apps/worker", "apps/api"]
# Pygmalion runs as a subprocess plugin in its own venv (torch/CUDA), see docs/DECISIONS.md.
exclude = ["plugins/pygmalion"]

[tool.uv.sources]
atelier-domain = { workspace = true }
atelier-plugin-sdk = { workspace = true }
atelier-plugin-host = { workspace = true }
atelier-show-engine = { workspace = true }
atelier-blender-bridge = { workspace = true }
atelier-cli = { workspace = true }
atelier-jobs = { workspace = true }
atelier-worker = { workspace = true }
atelier-api = { workspace = true }
atelier-assistant = { workspace = true }
atelier-builtin-animation = { workspace = true }
atelier-builtin-transitions = { workspace = true }
atelier-builtin-validators = { workspace = true }
atelier-builtin-exporters = { workspace = true }
atelier-pointille = { workspace = true }
atelier-blender-skybrush = { workspace = true }

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in docs (including the spec) are sketches, not sources.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
# N818: error names are part of the plugin contract (InvalidParams, Cancelled, ...).
# UP046/UP047: TypeVar generics read better than PEP 695 for the role base classes.
ignore = ["N818", "UP046", "UP047"]
# Messages for the user and the assistant are Russian on purpose: Cyrillic letters
# and the en dash in them are not look-alikes of Latin ones.
allowed-confusables = [
    "а", "в", "г", "е", "к", "м", "н", "о", "р", "с", "т", "у", "х",
    "А", "В", "Е", "К", "М", "Н", "О", "Р", "С", "Т", "Х", "–",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares parameters through these calls in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Depends"]

[tool.ruff.lint.isort]
known-first-party = ["atelier_*"]

# --- mypy -------------------------------------------------------------------
# Strict for all core packages (the spec requires it at least for domain and
# show_engine). Blender scripts run inside Blender's own Python with bpy and are
# not type-checked here.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/*/src", "apps/cli/src", "apps/worker/src", "apps/api/src", "plugins/*/src", "tests"]
exclude = ['packages/blender_bridge/src/atelier_blender_bridge/scripts/']
explicit_package_bases = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/domain/src",
    "packages/plugin_sdk/src",
    "packages/plugin_host/src",
    "packages/show_engine/src",
    "packages/blender_bridge/src",
    "packages/jobs/src",
    "packages/assistant/src",
    "apps/cli/src",
    "apps/worker/src",
    "apps/api/src",
]

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["scipy.*", "trimesh.*", "soundfile.*", "pointille.*", "dronegen_server.*"]
ignore_missing_imports = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "packages", "plugins", "apps"]
# Slow tests (separate venvs, real Blender builds) run with: uv run pytest -m slow
addopts = ["-ra", "--import-mode=importlib", "--strict-markers", "-m", "not slow"]
filterwarnings = [
    # Starlette asks for httpx2 in its test client; nothing in our code depends on it.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "blender: needs a local Blender (path from atelier.toml); skipped otherwise",
    "slow: spawns subprocesses or builds separate environments",
    "pygmalion: needs Pygmalion's runtime (its own venv); skipped otherwise",
    "llm: starts a real llama-server on the GPU (ATELIER_LLAMA_EXE, ATELIER_LLAMA_MODEL); skipped otherwise",
]
