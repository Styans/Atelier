[project]
name = "atelier-worker"
version = "0.1.0"
description = "The worker process: runs queued jobs one at a time"
requires-python = ">=3.12"
dependencies = [
    "atelier-jobs",
    "atelier-show-engine",
]

[project.scripts]
atelier-worker = "atelier_worker.worker:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
