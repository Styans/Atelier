[project]
name = "atelier-assistant"
version = "0.1.0"
description = "The chat assistant: LLM client interface, local llama-server provider, tools and turns"
requires-python = ">=3.12"
dependencies = [
    "atelier-jobs",
    "atelier-show-engine",
    "httpx>=0.27",
    "pydantic>=2.9",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
