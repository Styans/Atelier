[project]
name = "atelier-plugin-host"
version = "0.1.0"
description = "Plugin host: discovery, registry, health checks, in-process and subprocess runners"
requires-python = ">=3.12"
dependencies = [
    "atelier-domain",
    "atelier-plugin-sdk",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
