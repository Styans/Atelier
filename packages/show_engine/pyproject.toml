[project]
name = "atelier-show-engine"
version = "0.1.0"
description = "Show engine: project store, provenance, stage orchestration, compiler and validation"
requires-python = ">=3.12"
dependencies = [
    "atelier-domain",
    "atelier-plugin-sdk",
    "atelier-plugin-host",
    "numpy>=2.1",
    "pillow>=11.0",
    "pydantic>=2.9",
    "scipy>=1.14",
    "soundfile>=0.12",
    "trimesh>=4.5",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
